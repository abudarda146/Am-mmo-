
<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>গল্পের আসর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Tiro Bangla', serif;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .animate-blink {
        animation: blink 1s step-end infinite;
      }
      
      @keyframes message-pop {
        0% {
          opacity: 0;
          transform: translateY(20px) scale(0.95);
        }
        70% {
          transform: translateY(-2px) scale(1.02);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-message-pop {
        animation: message-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
      .audio-progress-slider::-webkit-slider-runnable-track {
        background: transparent;
        height: 100%;
        border: none;
      }
      .audio-progress-slider::-moz-range-track {
        background: transparent;
        height: 100%;
        border: none;
      }
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      .animate-shimmer {
        background: linear-gradient(110deg, transparent 40%, rgba(255, 255, 255, 0.15), transparent 60%);
        background-size: 200% 100%;
        animation: shimmer 2s infinite linear;
      }
      @keyframes pulse-glow {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 10px 5px rgba(251, 191, 36, 0.4);
        }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s infinite ease-in-out;
      }
    </style>

  }
}
</script>
